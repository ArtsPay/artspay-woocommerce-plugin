name: Code Review

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php-syntax-matrix:
    name: PHP Syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (Requires PHP), recommended, and newest.
        php: ["8.0", "8.3", "8.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: ./bin/check-php-syntax.sh

  # The main branch ruleset requires a check named "PHP Syntax", so this job
  # reports one result for the whole matrix above.
  php-syntax:
    name: PHP Syntax
    needs: php-syntax-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.php-syntax-matrix.result }}" = "success"

  phpcs-security:
    name: PHP CodeSniffer (WordPress security sniffs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: cs2pr, phpcs

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs:"^3.0" phpcompatibility/phpcompatibility-wp:"*" --no-progress
          ~/.composer/vendor/bin/phpcs --config-set installed_paths ~/.composer/vendor/wp-coding-standards/wpcs,~/.composer/vendor/phpcompatibility/php-compatibility,~/.composer/vendor/phpcompatibility/phpcompatibility-paragonie,~/.composer/vendor/phpcompatibility/phpcompatibility-wp

      - name: Run PHPCS (security sniffs only)
        run: |
          ~/.composer/vendor/bin/phpcs \
            --standard=phpcs.xml \
            --report=checkstyle \
            . | cs2pr
