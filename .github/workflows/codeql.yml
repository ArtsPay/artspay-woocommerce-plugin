name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "34 2 * * 0"

jobs:
  analyze:
    name: Analyze
    # Code scanning is free on public repos but needs paid Code Security on private ones.
    # The public mirror (ArtsPay/artspay-woocommerce-plugin) scans the same code.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL does not support PHP. This only covers the JavaScript side;
        # PHP security coverage comes from the phpcs-security job in code-review.yml instead.
        language: ["javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
